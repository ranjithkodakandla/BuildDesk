version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - USE_SQL_REPOSITORY=true
      # We default to sqlite for local dev unless explicitly running postgres
      - DATABASE_URL=sqlite:///./builddesk.db
      - DEBUG=true
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: builddesk
      POSTGRES_PASSWORD: password
      POSTGRES_DB: builddesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builddesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
